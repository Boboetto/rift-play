<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#14112b"/>
      <stop offset="1" stop-color="#06050f"/>
    </linearGradient>
    <linearGradient id="rift" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#7cf3ff"/>
      <stop offset="0.5" stop-color="#b48cff"/>
      <stop offset="1" stop-color="#ff7ad9"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#9d7bff" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#9d7bff" stop-opacity="0"/>
    </radialGradient>
    <filter id="blur" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="112" fill="url(#bg)"/>
  <ellipse cx="256" cy="262" rx="210" ry="190" fill="url(#glow)"/>

  <!-- the rift: a jagged diagonal tear -->
  <path id="tear" d="M300 70 L268 168 L304 196 L236 300 L268 322 L206 442 L222 330 L188 308 L246 210 L214 186 Z"
        fill="url(#rift)" filter="url(#blur)" opacity="0.9"/>
  <path d="M300 70 L268 168 L304 196 L236 300 L268 322 L206 442 L222 330 L188 308 L246 210 L214 186 Z"
        fill="#f4efff"/>

  <!-- abstract shapes drifting out of the rift: outlined, monochrome, scattered -->
  <g fill="none" stroke="url(#rift)" stroke-width="13" stroke-linecap="round" stroke-linejoin="round">
    <polygon points="370,118 404,176 336,176" transform="rotate(14 370 157)"/>
    <circle cx="394" cy="300" r="30"/>
    <rect x="96" y="150" width="54" height="54" rx="6" transform="rotate(-18 123 177)"/>
    <path d="M110 330 L156 376 M156 330 L110 376"/>
  </g>
</svg>
